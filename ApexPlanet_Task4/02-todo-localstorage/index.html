<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Task Manager</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <h1>My To-Do List</h1>
  <p class="sub">Tasks are saved automatically in your browser.</p>
  <div class="input-row"><input id="taskInput" type="text" placeholder="Enter a task..."><button id="addBtn">Add Task</button></div>
  <div class="toolbar"><button id="clearBtn" class="danger">Clear All</button><span id="count"></span></div>
  <ul id="taskList"></ul>
</div>
<script src="script.js"></script>
</body>
</html>
